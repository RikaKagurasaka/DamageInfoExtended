name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore dependencies
        run: dotnet restore
      - name: Download Dalamud developer bundle
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"
      - name: Build
        run: dotnet build --no-restore --configuration Debug --nologo
      - name: Test
        run: dotnet test DamageInfoExtended.Tests/DamageInfoExtended.Tests.csproj --no-restore --nologo
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: DamageInfoExtended-debug
          path: ./DamageInfoPlugin/bin/Debug/*
